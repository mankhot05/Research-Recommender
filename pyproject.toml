[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-recommender"
version = "0.1.0"
description = "Agentic RAG app that recommends arXiv papers for a research question."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mayank Hothur" }]
# Keep in sync with requirements.txt (tests/test_packaging.py checks this).
dependencies = [
    "langchain",
    "langgraph",
    "langchain-openai",
    "pinecone",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "arxiv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["app"]
